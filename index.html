<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>そろばん 読み上げマスター！</title>
<style>
  :root {
    --bg-main: #131127;
    --card-bg: #1f1b3c;
    --neon-pink: #ff2a85;
    --neon-pink-shadow: #b31055;
    --neon-cyan: #00f0ff;
    --neon-cyan-dark: #0099ab;
    --neon-yellow: #ffe600;
    --neon-green: #05ffa1;
    --neon-green-shadow: #00b36f;
    --lcd-bg: #0a0915;
    --text-sub: #a5a2cb;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: radial-gradient(circle at 50% 10%, #2b245e 0%, var(--bg-main) 100%);
    min-height: 100vh;
    margin: 0;
    padding: 10px 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #ffffff;
    user-select: none;
  }

  .container {
    background: var(--card-bg);
    max-width: 440px;
    width: 100%;
    padding: 16px 14px;
    border-radius: 30px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.15);
    border: 3px solid #363066;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: max-width 0.25s ease;
  }

  /* PC・横向きタブレット用 ワイド2列レイアウト */
  .main-grid {
    display: flex;
    flex-direction: column;
  }

  .left-panel, .right-panel {
    display: flex;
    flex-direction: column;
  }

  @media (min-width: 768px) {
    body {
      padding: 16px;
    }
    .container {
      max-width: 880px;
      padding: 20px 24px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 14px;
    }
    .main-grid {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 20px;
      align-items: stretch;
    }
    .right-panel {
      background: rgba(10, 9, 21, 0.45);
      border: 1.5px solid #363066;
      border-radius: 20px;
      padding: 14px;
      justify-content: space-between;
    }
    .display-ans {
      height: 64px;
      line-height: 64px;
      font-size: 38px;
      margin: 0 0 12px 0;
    }
    button.key {
      padding: 16px 0;
      font-size: 26px;
    }
    .judge-btn {
      padding: 15px;
      font-size: 18px;
    }
  }

  #confettiCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }

  .gadget-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 0 4px; gap: 6px; }
  .gadget-lights { display: flex; gap: 6px; align-items: center; }
  .dot-light { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 6px currentColor; }
  .dot-pink { background: var(--neon-pink); color: var(--neon-pink); }
  .dot-cyan { background: var(--neon-cyan); color: var(--neon-cyan); }
  .dot-yellow { background: var(--neon-yellow); color: var(--neon-yellow); }

  .header-right-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .offline-btn {
    background: rgba(0, 240, 255, 0.12);
    border: 1px solid var(--neon-cyan);
    color: var(--neon-cyan);
    font-size: 11px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .offline-btn:active { transform: scale(0.95); }
  .offline-btn.saved {
    background: rgba(5, 255, 161, 0.15);
    border-color: var(--neon-green);
    color: var(--neon-green);
  }

  .header-badge {
    background: rgba(255, 42, 133, 0.15); border: 1px solid var(--neon-pink);
    color: #ff7ebb; font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 20px; letter-spacing: 1px;
  }

  h1 { margin: 2px 0 10px 0; font-size: 20px; font-weight: 900; color: #ffffff; letter-spacing: 1.5px; text-shadow: 0 0 10px rgba(0, 240, 255, 0.6); }

  .control-box {
    background: rgba(10, 9, 21, 0.6); border: 1.5px solid #363066; border-radius: 16px;
    padding: 8px 10px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 6px; text-align: left;
  }
  .control-row { display: flex; align-items: center; gap: 6px; }
  .control-row label { font-size: 12px; font-weight: bold; color: var(--neon-cyan); min-width: 55px; }
  .control-row select {
    flex: 1; font-size: 13px; font-weight: bold; padding: 6px 8px; border-radius: 10px;
    border: 1px solid #4a4388; background: #171433; color: #ffffff; outline: none;
  }

  .rank-spec-card {
    background: rgba(0, 240, 255, 0.05); border: 1px dashed var(--neon-cyan-dark); border-radius: 10px;
    padding: 6px 8px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; text-align: center;
  }
  .spec-item { display: flex; flex-direction: column; align-items: center; }
  .spec-label { font-size: 10px; color: var(--text-sub); font-weight: bold; }
  .spec-val { font-size: 12px; color: var(--neon-cyan); font-weight: 800; }

  .stats-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255, 230, 0, 0.08); border: 1px solid rgba(255, 230, 0, 0.3);
    border-radius: 10px; padding: 5px 10px; margin-bottom: 8px; font-weight: bold; color: var(--neon-yellow); font-size: 12px;
  }

  .progress-container {
    background: rgba(5, 255, 161, 0.08); border: 1px solid rgba(5, 255, 161, 0.3);
    border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; display: none;
  }
  .progress-text { font-size: 13px; font-weight: 900; color: var(--neon-green); margin-bottom: 4px; }
  .progress-bar-bg { background: #0d1e18; border: 1px solid var(--neon-green-shadow); border-radius: 6px; height: 12px; width: 100%; overflow: hidden; }
  .progress-bar-fill {
    background: linear-gradient(90deg, #00f0ff 0%, var(--neon-green) 100%);
    height: 100%; width: 0%; transition: width 0.3s ease-out; box-shadow: 0 0 8px var(--neon-green);
  }

  .timer-container {
    background: rgba(255, 42, 133, 0.08); border: 1px solid rgba(255, 42, 133, 0.3);
    border-radius: 12px; padding: 8px 10px; margin-bottom: 8px; display: none;
  }
  .timer-text { font-size: 13px; font-weight: 900; color: var(--neon-pink); margin-bottom: 4px; letter-spacing: 1px; }
  .timer-bar-bg { background: #1a0a14; border: 1px solid var(--neon-pink-shadow); border-radius: 6px; height: 10px; width: 100%; overflow: hidden; }
  .timer-bar-fill {
    background: linear-gradient(90deg, #00f0ff 0%, var(--neon-green) 100%);
    height: 100%; width: 100%; transition: width 0.1s linear, background 0.3s; box-shadow: 0 0 8px var(--neon-green);
  }

  .audio-area { margin-bottom: 8px; }
  .main-play-btn {
    width: 100%; padding: 14px 10px; font-size: 18px; font-weight: 900; color: #0b1a13;
    background: var(--neon-green); border: none; border-radius: 16px;
    box-shadow: 0 5px 0 var(--neon-green-shadow), 0 8px 15px rgba(5, 255, 161, 0.35); cursor: pointer; transition: transform 0.06s, box-shadow 0.06s;
    display: flex; justify-content: center; align-items: center; gap: 8px;
  }
  .main-play-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--neon-green-shadow); }
  .main-play-btn.playing { background: var(--neon-yellow); box-shadow: 0 5px 0 #b3a100, 0 8px 15px rgba(255, 230, 0, 0.4); color: #2b2400; }
  .main-play-btn.locked-btn { opacity: 0.5; pointer-events: none; background: #363066; box-shadow: 0 5px 0 #181533; color: #8b85be; }

  audio { display: none; }

  .speed-title { font-size: 11px; font-weight: bold; color: var(--text-sub); margin: 6px 0 4px 0; }
  .speed-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .speed-btn {
    padding: 7px 0; font-size: 11px; font-weight: bold; border: 1px solid #363066; border-radius: 8px;
    background: #171433; color: var(--text-sub); box-shadow: 0 2px 0 #2b245e; cursor: pointer; transition: all 0.1s;
  }
  .speed-btn.active { background: rgba(0, 240, 255, 0.2); border-color: var(--neon-cyan); color: #ffffff; box-shadow: 0 0 8px rgba(0, 240, 255, 0.5); font-weight: 900; }

  .display-ans {
    font-size: 32px; font-weight: 900; height: 52px; line-height: 52px; border-radius: 14px;
    margin: 8px 0; background: var(--lcd-bg); color: var(--neon-cyan); letter-spacing: 3px;
    border: 2px solid #28244e; box-shadow: inset 0 3px 8px rgba(0,0,0,0.8), 0 0 10px rgba(0, 240, 255, 0.15);
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.7); font-family: "Courier New", Courier, monospace, sans-serif; transition: opacity 0.2s;
  }

  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 8px; transition: opacity 0.2s; }
  button.key {
    font-size: 24px; font-weight: 900; padding: 13px 0; border: none; border-radius: 14px;
    background: #2b2650; color: #ffffff; box-shadow: 0 4px 0 #181533, 0 6px 10px rgba(0,0,0,0.3); cursor: pointer; transition: transform 0.05s, box-shadow 0.05s;
  }
  button.key:active { transform: translateY(3px); box-shadow: 0 1px 0 #181533; background: #363066; }
  button.action-btn { background: #1b1735; color: #8b85be; font-size: 16px; box-shadow: 0 4px 0 #0d0b1a; }

  .judge-btn {
    width: 100%; padding: 13px; font-size: 17px; font-weight: 900; color: #ffffff;
    background: var(--neon-pink); border: none; border-radius: 16px;
    box-shadow: 0 5px 0 var(--neon-pink-shadow), 0 8px 16px rgba(255, 42, 133, 0.4); cursor: pointer; transition: transform 0.05s, box-shadow 0.05s, opacity 0.2s; letter-spacing: 1px;
  }
  .judge-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--neon-pink-shadow); }
  
  .locked { opacity: 0.35; pointer-events: none; }

  .result-message { margin-top: 6px; font-size: 15px; font-weight: 900; min-height: 38px; display: flex; align-items: center; justify-content: center; }
  .correct-text { color: var(--neon-green); text-shadow: 0 0 10px rgba(5, 255, 161, 0.6); animation: pop 0.25s ease-out; }
  .incorrect-text { color: #ff4d6d; text-shadow: 0 0 8px rgba(255, 77, 109, 0.5); animation: pop 0.25s ease-out; }

  @keyframes pop { 0% { transform: scale(0.6); } 100% { transform: scale(1); } }

  .result-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(10, 8, 24, 0.92);
    display: none; justify-content: center; align-items: center; z-index: 1000; padding: 16px; box-sizing: border-box; animation: fadeIn 0.25s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .result-modal-card {
    background: #1f1b3c; border: 3px solid var(--neon-cyan); box-shadow: 0 0 30px rgba(0, 240, 255, 0.35);
    max-width: 380px; width: 100%; border-radius: 26px; padding: 22px 18px; text-align: center; animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes bounceIn { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

  .modal-badge { font-size: 48px; margin-bottom: 4px; display: inline-block; }
  .modal-title { font-size: 20px; font-weight: 900; color: #ffffff; margin: 0 0 12px 0; text-shadow: 0 0 10px rgba(0, 240, 255, 0.6); }
  .modal-score-box { background: #0d0b1d; border: 2px solid #363066; border-radius: 18px; padding: 14px; margin-bottom: 14px; }
  .score-total-label { font-size: 13px; font-weight: bold; color: var(--text-sub); margin-bottom: 4px; }
  .score-highlight { font-size: 46px; font-weight: 900; color: var(--neon-pink); text-shadow: 0 0 15px rgba(255, 42, 133, 0.7); line-height: 1.1; }
  .score-highlight span.small-unit { font-size: 20px; color: #ffffff; margin-left: 4px; }
  .score-comment { margin-top: 8px; font-size: 14px; font-weight: 900; color: var(--neon-yellow); }

  .modal-btn-area { display: flex; flex-direction: column; gap: 8px; }
  .modal-btn { width: 100%; padding: 13px 0; font-size: 16px; font-weight: 900; border: none; border-radius: 14px; cursor: pointer; transition: transform 0.05s; }
  .modal-btn:active { transform: translateY(2px); }
  .modal-btn-retry { background: var(--neon-green); color: #0d1e18; box-shadow: 0 4px 0 var(--neon-green-shadow); }
  .modal-btn-close { background: #2b2650; color: #ffffff; border: 1px solid #4a4388; }
</style>
</head>
<body>

<div class="container">
  <canvas id="confettiCanvas"></canvas>

  <div class="gadget-header">
    <div class="gadget-lights">
      <div class="dot-light dot-pink"></div>
      <div class="dot-light dot-cyan"></div>
      <div class="dot-light dot-yellow"></div>
    </div>
    <div class="header-right-group">
      <button type="button" id="offlineSaveBtn" class="offline-btn" onclick="cacheAllForOffline()">📥 オフライン保存</button>
      <span class="header-badge" id="modeBadge">CYBER SOROBAN</span>
    </div>
  </div>

  <h1>読み上げマスター</h1>

  <div class="main-grid">
    <!-- 左側パネル -->
    <div class="left-panel">
      <div class="control-box">
        <div class="control-row">
          <label>級・段：</label>
          <select id="rankSelect" onchange="onRankChange()"></select>
        </div>
        <div class="rank-spec-card">
          <div class="spec-item"><span class="spec-label">桁数</span><span class="spec-val" id="specDigits">-</span></div>
          <div class="spec-item"><span class="spec-label">口数</span><span class="spec-val" id="specSteps">-</span></div>
          <div class="spec-item"><span class="spec-label">内容・早さ</span><span class="spec-val" id="specSpeed">-</span></div>
        </div>
        <div class="control-row">
          <label>問題数：</label>
          <select id="modeSelect" onchange="onModeChange()">
            <option value="select">好きな問題を1問選ぶ</option>
            <option value="3">連続テスト（3問）</option>
            <option value="5">連続テスト（5問）</option>
            <option value="10">連続テスト（10問）</option>
          </select>
        </div>
        <div class="control-row" id="singleQuestionRow">
          <label>問題：</label>
          <select id="questionSelect" onchange="changeQuestion()"></select>
        </div>
      </div>

      <div class="stats-bar">
        <span id="sessionStatus">１問ずつ れんしゅう</span>
        <span>🔥 れんぞく：<span id="streakCount">0</span> 問</span>
      </div>

      <div class="progress-container" id="progressContainer">
        <div class="progress-text" id="progressText">STAGE 1 / 5</div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBarFill"></div></div>
      </div>

      <div class="timer-container" id="timerContainer">
        <div class="timer-text" id="timerText">TIME LIMIT: 30.0s</div>
        <div class="timer-bar-bg"><div class="timer-bar-fill" id="timerBarFill"></div></div>
      </div>

      <div class="audio-area">
        <audio id="audioPlayer"></audio>
        <button type="button" id="mainPlayBtn" class="main-play-btn" onclick="triggerPlay()">▶ もんだいを きく</button>
        <div class="speed-title">SPEED CONTROLLER</div>
        <div class="speed-grid">
          <button type="button" class="speed-btn" onclick="setSpeed(0.8, this)">0.8x ゆっくり</button>
          <button type="button" class="speed-btn" onclick="setSpeed(0.9, this)">0.9x やや遅</button>
          <button type="button" class="speed-btn active" id="defaultSpeedBtn" onclick="setSpeed(1.0, this)">1.0x ふつう</button>
          <button type="button" class="speed-btn" onclick="setSpeed(1.2, this)">1.2x やや速</button>
          <button type="button" class="speed-btn" onclick="setSpeed(1.3, this)">1.3x 速い</button>
          <button type="button" class="speed-btn" onclick="setSpeed(1.4, this)">1.4x 高速</button>
        </div>
      </div>
    </div>

    <!-- 右側パネル -->
    <div class="right-panel">
      <div class="display-ans" id="inputDisplay">0</div>

      <div class="keypad" id="keypadArea">
        <button type="button" class="key" onclick="pressKey('7')">7</button><button type="button" class="key" onclick="pressKey('8')">8</button><button type="button" class="key" onclick="pressKey('9')">9</button>
        <button type="button" class="key" onclick="pressKey('4')">4</button><button type="button" class="key" onclick="pressKey('5')">5</button><button type="button" class="key" onclick="pressKey('6')">6</button>
        <button type="button" class="key" onclick="pressKey('1')">1</button><button type="button" class="key" onclick="pressKey('2')">2</button><button type="button" class="key" onclick="pressKey('3')">3</button>
        <button type="button" class="key action-btn" onclick="clearInput()">CLR</button><button type="button" class="key" onclick="pressKey('0')">0</button><button type="button" class="key action-btn" onclick="backspace()">DEL</button>
      </div>

      <div>
        <button type="button" class="judge-btn" id="judgeBtn" onclick="checkAnswer()">CHECK ANSWER (Enter)</button>
        <div class="result-message" id="resultArea"></div>
      </div>
    </div>
  </div>
</div>

<div class="result-overlay" id="resultModal">
  <div class="result-modal-card">
    <div class="modal-badge" id="modalBadge">💮</div>
    <h2 class="modal-title" id="modalTitle">MISSION COMPLETE!</h2>
    <div class="modal-score-box">
      <div class="score-total-label" id="modalTotalLabel">全 5 問中</div>
      <div class="score-highlight"><span id="modalCorrectScore">0</span><span class="small-unit">問 CLEAR!</span></div>
      <div class="score-comment" id="modalComment">すばらしい！よくがんばったね！</div>
    </div>
    <div class="modal-btn-area">
      <button type="button" class="modal-btn modal-btn-retry" onclick="retryTest()">🔁 REPLAY（もういちど）</button>
      <button type="button" class="modal-btn modal-btn-close" onclick="closeModal()">🏠 HOME（メニューへ）</button>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // ★ 1. 音声ファイルの拡張子設定
  // ==========================================
  const AUDIO_EXT = ".m4a";

  // ==========================================
  // ★ 2. 正解リスト（ご入力いただいたデータを反映済み！）
  // ==========================================
  const answerDatabase = {
    "20級": [2,3,4,2,4],
    "19級": [9,7,9,4,9],
    "18級": [4,9,7,9,7],
    "17級": [23,15,26,21,24,17,32,16,19,8,26,9,21,22,20],
    "16級": [51,20,55,19,51,8,61,16,52,12],
    "15級": [78,104,55,30,111,89,48,61,114,101],
    "14級": [352,138,148,58,270,136,163,116,235,158,139,51,192,95,253],
    "13級": [270,215,244,202,270,222,307,188,273,275,246,119,319,172,311],
    "12級": [469,104,377,141,337,301,331,100,451,156],
    "11級": [775,224,503,270,540,353,540,332,473,308,544,385,503,461,500],
    "10級": [ ],

    "2級":  [ ],
    "1級":  [ ],
    "準初段": [ ],
    "初段":   [ ],

    "準四段": [ ],
    "四段":   [ ],

    "準六段": [ ],
    "六段":   [ ],
    "準七段": [ ],

    "十八段": [ ],
    "十九段": [ ],
    "二十段": [ ]
  };

  // ==========================================
  // 3. 全49ランクの条件定義
  // ==========================================
  const rankSpecs = {
    "20級":   { digits: "1桁",     steps: "5口",  speed: "いちだま" },
    "19級":   { digits: "1桁",     steps: "8口",  speed: "ごだま" },
    "18級":   { digits: "1桁",     steps: "10口", speed: "りょうほう" },
    "17級":   { digits: "1桁",     steps: "5口",  speed: "ふつう" },
    "16級":   { digits: "1桁",     steps: "10口", speed: "ふつう" },
    "15級":   { digits: "1〜2桁",  steps: "5口",  speed: "ふつう" },
    "14級":   { digits: "1〜2桁",  steps: "10口", speed: "ふつう" },
    "13級":   { digits: "2桁",     steps: "5口",  speed: "ふつう" },

  // ==========================================
  // ★ 音声ファイルパス生成（11級/11.1.m4a 形式）

  function getAudioFilePath(rank, num) {
    const prefix = rank.replace("級", "");
    return `${rank}/${prefix}.${num}${AUDIO_EXT}`;
  }

  // ==========================================
  // ★ オフライン保存機能（Service Worker 登録＆一括キャッシュ）
  // ==========================================
  const CACHE_NAME = "soroban-yomiage-v2";

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    });
  }

  async function cacheAllForOffline() {
    clearFocus();
    const btn = document.getElementById("offlineSaveBtn");
    if (!("caches" in window)) {
      alert("このブラウザはオフライン保存に対応していません。ChromeまたはSafariでお試しください。");
      return;
    }

    const urlsToCache = ["./", "./index.html"];
    Object.keys(answerDatabase).forEach(rank => {
      const list = answerDatabase[rank] || [];
      list.forEach((_, idx) => {
        urlsToCache.push(getAudioFilePath(rank, idx + 1));
      });
    });

    btn.disabled = true;
    let savedCount = 0;
    const total = urlsToCache.length;

    try {
      const cache = await caches.open(CACHE_NAME);
      for (let i = 0; i < total; i++) {
        const url = urlsToCache[i];
        btn.innerText = `保存中 ${i + 1}/${total}`;
        try {
          const res = await fetch(url);
          if (res.ok) {
            await cache.put(url, res.clone());
            savedCount++;
          }
        } catch (e) {
          // 未アップロードのファイルはスキップして続行
        }
      }
      btn.classList.add("saved");
      btn.innerText = "✅ オフラインOK";
      alert(`タブレットへの保存が完了しました！（計 ${savedCount} 件）\nこれ以降はWi-Fiをオフにしても練習できます。`);
    } catch (err) {
      btn.innerText = "📥 オフライン保存";
      alert("保存中にエラーが発生しました。インターネットに接続した状態で再度お試しください。");
    } finally {
      btn.disabled = false;
    }
  }

  // 4. 効果音
  let audioCtx = null;
  function initAudioContext() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playBeepKey() {
    initAudioContext(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = "sine"; osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.05);
  }
  function playBeepAction() {
    initAudioContext(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = "triangle"; osc.frequency.setValueAtTime(320, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.06);
  }
  function playCorrectSound() {
    initAudioContext(); const now = audioCtx.currentTime;
    [ { freq: 587.33, time: 0 }, { freq: 880, time: 0.12 } ].forEach(tone => {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = "sine"; osc.frequency.setValueAtTime(tone.freq, now + tone.time);
      gain.gain.setValueAtTime(0.2, now + tone.time); gain.gain.exponentialRampToValueAtTime(0.001, now + tone.time + 0.35);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + tone.time); osc.stop(now + tone.time + 0.35);
    });
  }
  function playIncorrectSound() {
    initAudioContext(); const now = audioCtx.currentTime;
    [0, 0.14].forEach(delay => {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = "sawtooth"; osc.frequency.setValueAtTime(130, now + delay);
      gain.gain.setValueAtTime(0.15, now + delay); gain.gain.exponentialRampToValueAtTime(0.01, now + delay + 0.1);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + delay); osc.stop(now + delay + 0.1);
    });
  }
  function playFanfareSound() {
    initAudioContext(); const now = audioCtx.currentTime;
    const melody = [ { f: 523.25, t: 0, d: 0.1 }, { f: 659.25, t: 0.12, d: 0.1 }, { f: 783.99, t: 0.24, d: 0.1 }, { f: 1046.50, t: 0.36, d: 0.45 } ];
    melody.forEach(note => {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = "triangle"; osc.frequency.setValueAtTime(note.f, now + note.t);
      gain.gain.setValueAtTime(0.25, now + note.t); gain.gain.exponentialRampToValueAtTime(0.001, now + note.t + note.d);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + note.t); osc.stop(now + note.t + note.d);
    });
  }

  // ==========================================
  // 5. アプリ状態管理
  // ==========================================
  let appState = 'idle';
  let currentInput = "";
  let streak = 0;
  let currentSpeed = 1.0;
  let testQueue = [];
  let currentTestIndex = 0;
  let correctCount = 0;
  let isTesting = false;
  let lastTestCount = 5;
  
  let countdownInterval = null;
  let nextTimer = null;
  let timeLeft = 0.0;
  let canSkipWait = false;

  const rankSelect = document.getElementById("rankSelect");
  const modeSelect = document.getElementById("modeSelect");
  const questionSelect = document.getElementById("questionSelect");
  const audio = document.getElementById("audioPlayer");
  const mainPlayBtn = document.getElementById("mainPlayBtn");
  const display = document.getElementById("inputDisplay");
  const keypadArea = document.getElementById("keypadArea");
  const resultArea = document.getElementById("resultArea");
  const streakCount = document.getElementById("streakCount");
  const sessionStatus = document.getElementById("sessionStatus");
  const judgeBtn = document.getElementById("judgeBtn");
  
  const timerContainer = document.getElementById("timerContainer");
  const timerText = document.getElementById("timerText");
  const timerBarFill = document.getElementById("timerBarFill");
  const resultModal = document.getElementById("resultModal");

  function clearFocus() {
    if (document.activeElement && typeof document.activeElement.blur === 'function') {
      document.activeElement.blur();
    }
  }

  function setInputLocked(locked) {
    if (locked) {
      keypadArea.classList.add("locked");
      judgeBtn.classList.add("locked");
      display.classList.add("locked");
    } else {
      keypadArea.classList.remove("locked");
      judgeBtn.classList.remove("locked");
      display.classList.remove("locked");
    }
  }

  function clearAllTimers() {
    clearInterval(countdownInterval);
    clearTimeout(nextTimer);
  }

  document.addEventListener('keydown', function(event) {
    if (resultModal.style.display === "flex") {
      if (event.key === 'Enter') {
        event.preventDefault();
        clearFocus();
        retryTest();
      } else if (event.key === 'Escape') {
        event.preventDefault();
        clearFocus();
        closeModal();
      }
      return;
    }

    if (document.activeElement && document.activeElement.tagName === 'SELECT') {
      if (event.key === 'Enter') {
        setTimeout(clearFocus, 10);
      }
      return;
    }

    if (event.key === ' ' || event.code === 'Space') {
      event.preventDefault();
      clearFocus();
      if (appState === 'test_ready' || appState === 'single_ready') triggerPlay();
      return;
    }

    if (event.key === 'Enter') {
      event.preventDefault();
      clearFocus();
      if (appState === 'inputting') {
        checkAnswer();
      } else if (appState === 'result' && canSkipWait) {
        skipWaitAndProceed();
      }
      return;
    }

    if (appState === 'inputting') {
      if (event.key >= '0' && event.key <= '9') {
        event.preventDefault();
        pressKey(event.key);
      } else if (event.key === 'Backspace') {
        event.preventDefault();
        backspace();
      } else if (event.key === 'Escape' || event.key.toLowerCase() === 'c' || event.key === 'Delete') {
        event.preventDefault();
        clearInput();
      }
    }
  });

  audio.onended = function() {
    mainPlayBtn.classList.remove("playing");
    mainPlayBtn.innerHTML = "▶ もういちど きく";
    
    if (isTesting) {
      startCountdown();
    } else {
      appState = 'inputting';
      setInputLocked(false);
      judgeBtn.innerText = "CHECK ANSWER (Enter)";
    }
  };

  function startCountdown() {
    appState = 'inputting';
    setInputLocked(false);
    judgeBtn.innerText = "CHECK ANSWER (Enter)";
    
    timeLeft = 30.0;
    updateTimerUI();
    
    countdownInterval = setInterval(() => {
      timeLeft -= 0.1;
      if (timeLeft <= 0) {
        timeLeft = 0;
        clearInterval(countdownInterval);
        handleTimeout();
      }
      updateTimerUI();
    }, 100);
  }

  function updateTimerUI() {
    timerText.innerText = `TIME LIMIT: ${timeLeft.toFixed(1)}s`;
    const percent = (timeLeft / 30.0) * 100;
    timerBarFill.style.width = percent + "%";
    
    if (timeLeft <= 10.0) {
      timerBarFill.style.background = "linear-gradient(90deg, #ff2a85 0%, #ff4d6d 100%)";
      timerBarFill.style.boxShadow = "0 0 8px #ff2a85";
    } else {
      timerBarFill.style.background = "linear-gradient(90deg, #00f0ff 0%, var(--neon-green) 100%)";
      timerBarFill.style.boxShadow = "0 0 8px var(--neon-green)";
    }
  }

  function triggerPlay() {
    clearFocus();
    if (appState !== 'test_ready' && appState !== 'single_ready') return;
    if (!audio.src || audio.src.endsWith(window.location.pathname)) return;

    appState = 'playing';
    setInputLocked(true);
    clearAllTimers();
    
    mainPlayBtn.classList.add("locked-btn");

    if (isTesting) {
      timerContainer.style.display = "block";
      timerText.innerText = "🔊 LISTENING...";
      timerBarFill.style.width = "100%";
      timerBarFill.style.background = "linear-gradient(90deg, #00f0ff 0%, var(--neon-green) 100%)";
    }

    audio.currentTime = 0;
    audio.play().then(() => {
      mainPlayBtn.classList.remove("locked-btn");
      mainPlayBtn.classList.add("playing");
      mainPlayBtn.innerHTML = "🔊 さいせいちゅう...";
    }).catch(e => {
      const sampleFile = getAudioFilePath(rankSelect.value, 1);
      alert(`音声を再生できません。「${sampleFile}」が正しく配置されているか確認してください。`);
      appState = isTesting ? 'test_ready' : 'single_ready';
      mainPlayBtn.classList.remove("locked-btn");
    });
  }

  Object.keys(rankSpecs).forEach(rank => {
    const spec = rankSpecs[rank];
    const opt = document.createElement("option");
    opt.value = rank;
    opt.innerText = `${rank}（${spec.digits} / ${spec.steps} / ${spec.speed}）`;
    rankSelect.appendChild(opt);
  });
  rankSelect.value = "20級";

  function getActiveQuestions() {
    const rank = rankSelect.value;
    const answers = answerDatabase[rank] || [];
    return answers.map((ans, index) => {
      const num = index + 1;
      return {
        title: `第${num}問`,
        file: getAudioFilePath(rank, num),
        answer: ans
      };
    });
  }

  function onRankChange() {
    clearFocus();
    clearAllTimers();
    const spec = rankSpecs[rankSelect.value] || { digits: "-", steps: "-", speed: "-" };
    document.getElementById("specDigits").innerText = spec.digits;
    document.getElementById("specSteps").innerText = spec.steps;
    document.getElementById("specSpeed").innerText = spec.speed;
    refreshQuestionList();
  }

  function onModeChange() {
    clearFocus();
    clearAllTimers();
    audio.pause();
    const mode = modeSelect.value;
    if (mode === "select") {
      document.getElementById("singleQuestionRow").style.display = "flex";
      document.getElementById("progressContainer").style.display = "none";
      timerContainer.style.display = "none";
      sessionStatus.innerText = "１問ずつ れんしゅう";
      isTesting = false;
      changeQuestion();
    } else {
      document.getElementById("singleQuestionRow").style.display = "none";
      sessionStatus.innerText = "⚡ 連続テスト モード";
      lastTestCount = parseInt(mode, 10);
      startContinuousTest(lastTestCount);
    }
  }

  function refreshQuestionList() {
    const questions = getActiveQuestions();
    questionSelect.innerHTML = "";
    if (questions.length === 0) {
      const opt = document.createElement("option");
      opt.innerText = "問題準備中";
      questionSelect.appendChild(opt);
      resetAudioState();
      setInputLocked(true);
      sessionStatus.innerText = "問題がまだありません";
      appState = 'idle';
      return;
    }
    questions.forEach((q, idx) => {
      const opt = document.createElement("option");
      opt.value = idx;
      opt.innerText = q.title;
      questionSelect.appendChild(opt);
    });
    onModeChange();
  }

  function changeQuestion() {
    clearFocus();
    clearAllTimers();
    const questions = getActiveQuestions();
    if (questions.length === 0) return;
    const idx = parseInt(questionSelect.value, 10) || 0;
    appState = 'single_ready';
    loadQuestion(questions[idx]);
    judgeBtn.innerText = "CHECK ANSWER (Enter)";
  }

  function startContinuousTest(count) {
    clearAllTimers();
    const questions = getActiveQuestions();
    if (questions.length === 0) return;

    testQueue = [];
    while (testQueue.length < count) {
      const pool = [...questions];
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      if (testQueue.length > 0 && pool.length > 1 && testQueue[testQueue.length - 1].file === pool[0].file) {
        [pool[0], pool[1]] = [pool[1], pool[0]];
      }
      const needed = count - testQueue.length;
      testQueue.push(...pool.slice(0, needed));
    }

    currentTestIndex = 0;
    correctCount = 0;
    isTesting = true;

    loadTestStep(false);
  }

  function loadTestStep(autoPlay = false) {
    const currentQ = testQueue[currentTestIndex];
    appState = 'test_ready';
    canSkipWait = false;
    
    loadQuestion(currentQ);
    
    document.getElementById("progressContainer").style.display = "block";
    document.getElementById("progressText").innerText = `STAGE ${currentTestIndex + 1} / ${testQueue.length}`;
    const percent = ((currentTestIndex + 1) / testQueue.length) * 100;
    document.getElementById("progressBarFill").style.width = percent + "%";

    timerContainer.style.display = "block";
    timerText.innerText = autoPlay ? "🔊 GET READY..." : "▶ PRESS PLAY TO START";
    timerBarFill.style.width = "100%";
    timerBarFill.style.background = "linear-gradient(90deg, #00f0ff 0%, var(--neon-green) 100%)";

    if (autoPlay) {
      setTimeout(() => { triggerPlay(); }, 1000);
    }
  }

  function loadQuestion(q) {
    setInputLocked(true);
    resetAudioState();
    audio.src = q.file;
    audio.playbackRate = currentSpeed;
    audio.load();
    currentInput = "";
    display.innerText = "0";
    resultArea.innerHTML = "";
    judgeBtn.innerText = "LOCKED";
  }

  function resetAudioState() {
    audio.pause();
    mainPlayBtn.classList.remove("playing", "locked-btn");
    mainPlayBtn.innerHTML = "▶ もんだいを きく";
  }

  function setSpeed(speed, btn) {
    clearFocus();
    initAudioContext(); currentSpeed = speed; audio.playbackRate = currentSpeed;
    document.querySelectorAll(".speed-grid .speed-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  }

  function pressKey(num) {
    clearFocus();
    if (appState !== 'inputting') return;
    playBeepKey();
    if (currentInput === "0") currentInput = "";
    if (currentInput.length < 15) {
      currentInput += num;
      display.innerText = Number(currentInput).toLocaleString();
    }
  }
  function clearInput() {
    clearFocus();
    if (appState !== 'inputting') return;
    playBeepAction(); currentInput = ""; display.innerText = "0"; resultArea.innerHTML = "";
  }
  function backspace() {
    clearFocus();
    if (appState !== 'inputting') return;
    playBeepAction();
    currentInput = currentInput.slice(0, -1);
    display.innerText = currentInput === "" ? "0" : Number(currentInput).toLocaleString();
  }

  function handleTimeout() {
    appState = 'result';
    setInputLocked(true);
    timerText.innerText = "TIME UP!";
    playIncorrectSound();
    
    streak = 0; streakCount.innerText = streak;
    const targetAnswer = testQueue[currentTestIndex].answer;
    resultArea.innerHTML = `<div class='incorrect-text'>TIME UP! 正解は <strong>${targetAnswer.toLocaleString()}</strong></div>`;
    
    canSkipWait = true;
    judgeBtn.classList.remove("locked");
    judgeBtn.innerText = "⏩ SKIP WAIT (Enter / Click)";
    nextTimer = setTimeout(() => { proceedToNextIndex(); }, 15000);
  }

  function checkAnswer() {
    clearFocus();
    if (appState === 'result' && canSkipWait) {
      skipWaitAndProceed();
      return;
    }
    if (appState !== 'inputting') return;
    
    if (!currentInput) {
      resultArea.innerHTML = "<span class='incorrect-text'>数字を入力してね！</span>";
      playIncorrectSound();
      return;
    }

    appState = 'result';
    setInputLocked(true);
    clearInterval(countdownInterval);
    if (isTesting) timerText.innerText = "CHECKING...";

    const userVal = Number(currentInput);
    let targetAnswer = isTesting ? testQueue[currentTestIndex].answer : getActiveQuestions()[parseInt(questionSelect.value)].answer;
    
    if (userVal === targetAnswer) {
      playCorrectSound();
      startConfetti();
      streak++; streakCount.innerText = streak;
      
      if (isTesting) {
        correctCount++;
        resultArea.innerHTML = "<div class='correct-text'>💮 CLEAR!</div>";
        canSkipWait = false;
        judgeBtn.innerText = "WAIT 5s... (次へ)";
        nextTimer = setTimeout(() => { proceedToNextIndex(); }, 5000);
      } else {
        resultArea.innerHTML = "<div class='correct-text'>💮 大正解！EXCELLENT!</div>";
        appState = 'single_ready';
      }

    } else {
      playIncorrectSound();
      streak = 0; streakCount.innerText = streak;
      
      if (isTesting) {
        resultArea.innerHTML = `<div class='incorrect-text'>MISS! 正解は <strong>${targetAnswer.toLocaleString()}</strong></div>`;
        canSkipWait = true;
        judgeBtn.classList.remove("locked");
        judgeBtn.innerText = "⏩ SKIP WAIT (Enter / Click)";
        nextTimer = setTimeout(() => { proceedToNextIndex(); }, 10000);
      } else {
        resultArea.innerHTML = `<div class='incorrect-text'>MISS! 正解は <strong>${targetAnswer.toLocaleString()}</strong></div>`;
        appState = 'single_ready';
      }
    }
  }

  function skipWaitAndProceed() {
    clearFocus();
    if (!canSkipWait) return;
    canSkipWait = false;
    judgeBtn.classList.add("locked");
    clearTimeout(nextTimer);
    playBeepAction();
    judgeBtn.innerText = "NEXT IN 2s...";
    nextTimer = setTimeout(() => { proceedToNextIndex(); }, 2000);
  }

  function proceedToNextIndex() {
    currentTestIndex++;
    if (currentTestIndex < testQueue.length) {
      loadTestStep(true);
    } else {
      showResultModal();
    }
  }

  function showResultModal() {
    appState = 'idle';
    document.getElementById("modalTotalLabel").innerText = `TOTAL STAGES：${testQueue.length} 問中`;
    document.getElementById("modalCorrectScore").innerText = correctCount;

    const rate = correctCount / testQueue.length;
    if (rate === 1.0) {
      document.getElementById("modalBadge").innerText = "👑";
      document.getElementById("modalTitle").innerText = "PERFECT CLEAR!!";
      document.getElementById("modalComment").innerText = "満点達成！超人的な集中力だね！";
    } else if (rate >= 0.8) {
      document.getElementById("modalBadge").innerText = "🥇";
      document.getElementById("modalTitle").innerText = "EXCELLENT!!";
      document.getElementById("modalComment").innerText = "合格ライン突破！素晴らしいスコア！";
    } else if (rate >= 0.5) {
      document.getElementById("modalBadge").innerText = "🥈";
      document.getElementById("modalTitle").innerText = "NICE FIGHT!!";
      document.getElementById("modalComment").innerText = "あと一歩で満点！もう1回挑んでみよう！";
    } else {
      document.getElementById("modalBadge").innerText = "👾";
      document.getElementById("modalTitle").innerText = "GOOD TRY!!";
      document.getElementById("modalComment").innerText = "スピードを少し落として再チャレンジしてみよう！";
    }

    resultModal.style.display = "flex";
    playFanfareSound();
    startBigConfetti();
  }

  function retryTest() {
    clearFocus();
    resultModal.style.display = "none";
    startContinuousTest(lastTestCount);
  }
  function closeModal() {
    clearFocus();
    resultModal.style.display = "none";
    modeSelect.value = "select";
    onModeChange();
  }

  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  let confetti = [];
  function resizeCanvas() { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; }
  window.addEventListener('resize', resizeCanvas); resizeCanvas();

  function startConfetti() { createConfettiBatch(40); }
  function startBigConfetti() { createConfettiBatch(100); }

  function createConfettiBatch(count) {
    resizeCanvas();
    const colors = ['#00f0ff', '#ff2a85', '#ffe600', '#05ffa1', '#bf55ec'];
    for (let i = 0; i < count; i++) {
      confetti.push({
        x: canvas.width / 2, y: canvas.height / 2,
        w: Math.random() * 8 + 4, h: Math.random() * 6 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        vx: (Math.random() - 0.5) * 16, vy: (Math.random() - 0.7) * 16,
        gravity: 0.35, rotation: Math.random() * 360, vr: (Math.random() - 0.5) * 12, life: 1.2
      });
    }
    requestAnimationFrame(renderConfetti);
  }
  function renderConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let active = false;
    confetti.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.rotation += p.vr; p.life -= 0.015;
      if (p.life > 0) {
        active = true; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.life); ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      }
    });
    if (active) requestAnimationFrame(renderConfetti); else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  onRankChange();
</script>
</body>
</html>
