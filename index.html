<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>そろばん 読み上げマスター！</title>
<style>
  /* ==========================================
     テーマカラー定義（読上あんざん：クールサイバー）
     ========================================== */
  :root, body.mode-anzan {
    --bg-gradient: radial-gradient(circle at 50% 10%, #2b245e 0%, #131127 100%);
    --card-bg: #1f1b3c;
    --card-border: #363066;
    --panel-bg: rgba(10, 9, 21, 0.55);
    --accent-main: #ff2a85;
    --accent-main-shadow: #b31055;
    --accent-sub: #00f0ff;
    --accent-sub-dark: #0099ab;
    --accent-yellow: #ffe600;
    --accent-green: #05ffa1;
    --accent-green-shadow: #00b36f;
    --lcd-bg: #0a0915;
    --lcd-text: #00f0ff;
    --lcd-glow: rgba(0, 240, 255, 0.7);
    --text-sub: #a5a2cb;
    --select-bg: #171433;
    --key-bg: #2b2650;
    --key-shadow: #181533;
  }

  /* ==========================================
     テーマカラー定義（読上算：そろばんゴールド＆アンバー）
     ========================================== */
  body.mode-soroban {
    --bg-gradient: radial-gradient(circle at 50% 10%, #4d3113 0%, #1e1206 100%);
    --card-bg: #2e1d0d;
    --card-border: #734b22;
    --panel-bg: rgba(20, 11, 4, 0.6);
    --accent-main: #ff9f1c;
    --accent-main-shadow: #b56500;
    --accent-sub: #ffd166;
    --accent-sub-dark: #c99626;
    --accent-yellow: #fff07c;
    --accent-green: #2ec4b6;
    --accent-green-shadow: #187a70;
    --lcd-bg: #140b04;
    --lcd-text: #ffd166;
    --lcd-glow: rgba(255, 209, 102, 0.7);
    --text-sub: #d6b896;
    --select-bg: #241609;
    --key-bg: #452c14;
    --key-shadow: #211408;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

  html, body {
    height: 100dvh;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    background: var(--bg-gradient);
    padding: 6px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #ffffff;
    user-select: none;
    transition: background 0.3s ease;
  }

  @media (max-height: 480px) {
    html, body { height: auto; overflow-y: auto; }
    .container { height: auto !important; max-height: none !important; }
  }

  .container {
    background: var(--card-bg);
    max-width: 460px;
    width: 100%;
    height: 100%;
    max-height: calc(100dvh - 12px);
    padding: 10px 11px;
    border-radius: 22px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.55), inset 0 2px 4px rgba(255, 255, 255, 0.15);
    border: 2.5px solid var(--card-border);
    text-align: center;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 5px;
    transition: max-width 0.25s ease, background 0.3s ease, border-color 0.3s ease;
  }

  .big-circle-overlay {
    position: absolute;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    z-index: 150;
  }
  .big-circle-overlay.show {
    display: flex;
    animation: circlePopFade 1.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  .big-circle-svg {
    width: min(68vw, 310px);
    height: min(68vw, 310px);
    filter: drop-shadow(0 0 24px rgba(255, 42, 85, 0.85));
  }
  .big-circle-path {
    stroke-dasharray: 500;
    stroke-dashoffset: 500;
    animation: drawCircle 0.4s ease-out forwards;
  }
  @keyframes drawCircle { to { stroke-dashoffset: 0; } }
  @keyframes circlePopFade {
    0% { transform: scale(0.55); opacity: 0; }
    18% { transform: scale(1.06); opacity: 1; }
    30% { transform: scale(1); opacity: 1; }
    78% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.08); opacity: 0; }
  }

  .top-header-wrap { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
  .title-bar { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .title-left { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .gadget-lights { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
  .dot-light { width: 7px; height: 7px; border-radius: 50%; box-shadow: 0 0 5px currentColor; }
  .dot-pink { background: var(--accent-main); color: var(--accent-main); }
  .dot-cyan { background: var(--accent-sub); color: var(--accent-sub); }
  .dot-yellow { background: var(--accent-yellow); color: var(--accent-yellow); }

  h1 {
    margin: 0; font-size: 16px; font-weight: 900; color: #ffffff; letter-spacing: 0.8px;
    text-shadow: 0 0 8px var(--lcd-glow); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .header-right-group { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .offline-btn {
    background: rgba(255, 255, 255, 0.08); border: 1px solid var(--accent-sub); color: var(--accent-sub);
    font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 20px; cursor: pointer; white-space: nowrap;
  }
  .offline-btn:active { transform: scale(0.95); }
  .offline-btn.saved { background: rgba(5, 255, 161, 0.15); border-color: var(--accent-green); color: var(--accent-green); }
  .header-badge { display: none; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--accent-main); color: var(--accent-main); font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 20px; }

  .subject-switcher {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: rgba(0, 0, 0, 0.35); padding: 3px; border-radius: 12px; border: 1px solid var(--card-border);
  }
  .subject-tab {
    padding: 6px 4px; border-radius: 9px; border: 1.5px solid transparent; background: transparent; color: var(--text-sub);
    font-size: 13px; font-weight: 900; cursor: pointer; transition: all 0.15s ease; display: flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap;
  }
  .subject-tab.active-anzan { background: linear-gradient(135deg, #ff2a85 0%, #8a2be2 100%); color: #ffffff; border-color: #00f0ff; box-shadow: 0 0 10px rgba(255, 42, 133, 0.5); }
  .subject-tab.active-soroban { background: linear-gradient(135deg, #ff9f1c 0%, #d96b00 100%); color: #ffffff; border-color: #fff07c; box-shadow: 0 0 10px rgba(255, 159, 28, 0.5); }

  .main-grid { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 5px; }
  .left-panel { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
  .right-panel { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 5px; }

  @media (min-width: 768px) {
    body { padding: 10px; }
    .container { max-width: 960px; max-height: calc(100dvh - 20px); padding: 14px 18px; gap: 10px; }
    .top-header-wrap { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { font-size: 19px; }
    .subject-switcher { width: 340px; flex-shrink: 0; }
    .subject-tab { padding: 7px 10px; font-size: 14px; }
    .header-badge { display: inline-block; }
    .main-grid { display: grid; grid-template-columns: 1.06fr 0.94fr; gap: 16px; align-items: stretch; }
    .left-panel { justify-content: space-between; gap: 7px; min-height: 0; }
    .right-panel { background: var(--panel-bg); border: 1.5px solid var(--card-border); border-radius: 18px; padding: 12px; gap: 8px; }
    .display-ans { height: 56px; line-height: 56px; font-size: 34px; }
    button.key { font-size: 24px; }
    .judge-btn { padding: 12px; font-size: 16px; }
  }

  #confettiCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }

  .student-box {
    background: rgba(255, 255, 255, 0.05); border: 1px solid var(--accent-main); border-radius: 12px; padding: 5px 8px; display: flex; flex-direction: column; gap: 4px; text-align: left;
  }
  .student-input-row { display: flex; align-items: center; gap: 5px; }
  .student-input-row label { font-size: 11px; font-weight: bold; color: var(--accent-sub); white-space: nowrap; }
  .student-input-row input { flex: 1; min-width: 0; font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--accent-main); background: var(--select-bg); color: #ffffff; outline: none; user-select: text; }
  .student-login-btn { background: var(--accent-main); color: #ffffff; border: none; border-radius: 8px; padding: 4px 10px; font-size: 11px; font-weight: 900; cursor: pointer; white-space: nowrap; }
  .student-login-btn:active { transform: scale(0.96); }

  .student-status-bar { display: none; flex-direction: column; gap: 4px; background: rgba(0, 0, 0, 0.45); border: 1px solid var(--card-border); border-radius: 8px; padding: 4px 7px; font-size: 11px; }
  .student-top-line { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
  .student-name-text { color: var(--accent-yellow); font-size: 12px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dual-grade-row { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .grade-pill { padding: 2px 5px; border-radius: 6px; font-size: 10px; font-weight: 900; text-align: center; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.15); color: var(--text-sub); }
  .grade-pill.current-subject-pill { background: rgba(5, 255, 161, 0.14); border: 1px solid var(--accent-green); color: #ffffff; }
  .grade-pill span.g-val { color: var(--accent-green); font-size: 11px; margin-left: 2px; }
  .student-edit-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .mini-edit-btn { background: transparent; border: 1px solid var(--text-sub); color: var(--text-sub); font-size: 9px; padding: 1px 5px; border-radius: 5px; cursor: pointer; white-space: nowrap; }

  .control-box { background: var(--panel-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 5px 8px; display: flex; flex-direction: column; gap: 4px; text-align: left; }
  .control-row { display: flex; align-items: center; gap: 5px; }
  .control-row label { font-size: 11px; font-weight: bold; color: var(--accent-sub); min-width: 44px; white-space: nowrap; }
  .control-row select { flex: 1; min-width: 0; font-size: 12px; font-weight: bold; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--card-border); background: var(--select-bg); color: #ffffff; outline: none; }

  .mode-question-split { display: flex; gap: 6px; align-items: center; }
  .mode-question-split .control-row { flex: 1; min-width: 0; }
  .rank-spec-card { background: rgba(255, 255, 255, 0.04); border: 1px dashed var(--accent-sub-dark); border-radius: 7px; padding: 2px 6px; display: flex; justify-content: space-around; align-items: center; font-size: 10px; }
  .spec-item { display: flex; align-items: center; gap: 4px; }
  .spec-label { color: var(--text-sub); font-weight: bold; }
  .spec-val { color: var(--accent-sub); font-weight: 800; }

  .stats-bar {
    display: flex; justify-content: space-between; align-items: center; background: rgba(255, 230, 0, 0.08); border: 1px solid rgba(255, 230, 0, 0.3); border-radius: 8px; padding: 3px 8px; font-weight: bold; color: var(--accent-yellow); font-size: 11px;
  }
  .bars-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .progress-container, .timer-container { background: rgba(5, 255, 161, 0.08); border: 1px solid rgba(5, 255, 161, 0.3); border-radius: 8px; padding: 4px 7px; display: none; }
  .timer-container { background: rgba(255, 255, 255, 0.05); border-color: var(--accent-main); }
  .progress-text, .timer-text { font-size: 10px; font-weight: 900; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .progress-text { color: var(--accent-green); }
  .timer-text { color: var(--accent-main); }
  .progress-bar-bg, .timer-bar-bg { background: rgba(0, 0, 0, 0.45); border: 1px solid var(--accent-green-shadow); border-radius: 4px; height: 7px; width: 100%; overflow: hidden; }
  .timer-bar-bg { border-color: var(--accent-main-shadow); }
  .progress-bar-fill, .timer-bar-fill { background: linear-gradient(90deg, var(--accent-sub) 0%, var(--accent-green) 100%); height: 100%; width: 0%; transition: width 0.3s ease-out; }
  .timer-bar-fill { width: 100%; transition: width 0.1s linear, background 0.3s; }

  .subject-notice-banner { font-size: 11px; font-weight: 900; padding: 3px 6px; border-radius: 7px; margin-bottom: 4px; }
  body.mode-anzan .subject-notice-banner { background: rgba(0, 240, 255, 0.12); border: 1px solid #00f0ff; color: #00f0ff; }
  body.mode-soroban .subject-notice-banner { background: rgba(255, 209, 102, 0.15); border: 1px solid #ffd166; color: #ffd166; }

  .audio-area { display: flex; flex-direction: column; }

  /* -------------------------------------
     再生ボタン周り（クリカツ用3ボタン対応）
     ------------------------------------- */
  .play-btn-grid {
    display: grid;
    grid-template-columns: 1.25fr 0.75fr;
    gap: 6px;
  }
  body.is-kurikatsu .play-btn-grid {
    grid-template-columns: 1.1fr 0.9fr 0.9fr;
  }

  .main-play-btn, .speak-ans-btn {
    width: 100%; font-weight: 900; border: none; border-radius: 12px; cursor: pointer;
    display: flex; justify-content: center; align-items: center; gap: 4px; white-space: nowrap;
  }
  .main-play-btn {
    padding: 9px 6px; font-size: 13px; color: #0b1a13; background: var(--accent-green);
    box-shadow: 0 3px 0 var(--accent-green-shadow), 0 5px 10px rgba(0, 0, 0, 0.3);
  }
  .main-play-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-green-shadow); }
  .main-play-btn.playing { background: var(--accent-yellow); box-shadow: 0 3px 0 #b3a100; color: #2b2400; }
  .main-play-btn.locked-btn { opacity: 0.45; pointer-events: none; background: var(--card-border); box-shadow: 0 3px 0 rgba(0,0,0,0.4); color: var(--text-sub); }

  .speak-ans-btn {
    padding: 9px 4px; font-size: 11px; color: #061821; background: var(--accent-sub);
    box-shadow: 0 3px 0 var(--accent-sub-dark), 0 5px 10px rgba(0, 0, 0, 0.3);
  }
  .speak-ans-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-sub-dark); }
  .speak-ans-btn.speaking { background: var(--accent-yellow); box-shadow: 0 3px 0 #b3a100; color: #2b2400; }
  .speak-ans-btn.locked-btn { opacity: 0.4; pointer-events: none; background: var(--card-border); box-shadow: 0 3px 0 rgba(0,0,0,0.4); color: var(--text-sub); }

  /* クリカツ録音再生ボタン用 */
  #recordedAnsBtn { display: none; }
  body.is-kurikatsu #recordedAnsBtn { display: flex; }
  .recorded-btn { background: #ff9f1c; color: #1e1206; box-shadow: 0 3px 0 #b56500; }
  .recorded-btn:active { box-shadow: 0 1px 0 #b56500; }
  .recorded-btn.speaking { background: #ffe600; box-shadow: 0 3px 0 #b3a100; color: #2b2400; }

  audio { display: none; }
  .speed-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; margin-top: 5px; }
  .speed-btn { padding: 4px 0; font-size: 10px; font-weight: bold; border: 1px solid var(--card-border); border-radius: 6px; background: var(--select-bg); color: var(--text-sub); cursor: pointer; }
  .speed-btn.active { background: rgba(255, 255, 255, 0.18); border-color: var(--accent-sub); color: #ffffff; box-shadow: 0 0 6px var(--lcd-glow); font-weight: 900; }

  .display-ans { font-size: 26px; font-weight: 900; height: 40px; line-height: 40px; border-radius: 11px; background: var(--lcd-bg); color: var(--lcd-text); letter-spacing: 2px; border: 1.5px solid var(--card-border); box-shadow: inset 0 2px 6px rgba(0,0,0,0.8); text-shadow: 0 0 8px var(--lcd-glow); font-family: "Courier New", Courier, monospace, sans-serif; flex-shrink: 0; }
  .keypad { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); gap: 5px; }
  button.key { font-size: 20px; font-weight: 900; padding: 0; border: none; border-radius: 11px; background: var(--key-bg); color: #ffffff; box-shadow: 0 3px 0 var(--key-shadow); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  button.key:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--key-shadow); filter: brightness(1.15); }
  button.action-btn { background: var(--select-bg); color: var(--text-sub); font-size: 13px; box-shadow: 0 3px 0 rgba(0,0,0,0.5); }
  .bottom-action-wrap { flex-shrink: 0; display: flex; flex-direction: column; gap: 3px; }
  .judge-btn { width: 100%; padding: 10px; font-size: 15px; font-weight: 900; color: #ffffff; background: var(--accent-main); border: none; border-radius: 12px; box-shadow: 0 3px 0 var(--accent-main-shadow); cursor: pointer; letter-spacing: 0.8px; }
  .judge-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-main-shadow); }
  .locked { opacity: 0.35; pointer-events: none; }
  .result-message { font-size: 13px; font-weight: 900; min-height: 18px; display: flex; align-items: center; justify-content: center; }
  .correct-text { color: var(--accent-green); text-shadow: 0 0 8px rgba(5, 255, 161, 0.6); animation: pop 0.25s ease-out; }
  .incorrect-text { color: #ff4d6d; text-shadow: 0 0 8px rgba(255, 77, 109, 0.5); animation: pop 0.25s ease-out; }
  @keyframes pop { 0% { transform: scale(0.6); } 100% { transform: scale(1); } }
  .result-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(10, 8, 24, 0.92); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 16px; box-sizing: border-box; animation: fadeIn 0.25s ease-out; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .result-modal-card { background: var(--card-bg); border: 3px solid var(--accent-sub); box-shadow: 0 0 30px var(--lcd-glow); max-width: 390px; width: 100%; border-radius: 26px; padding: 20px 16px; text-align: center; animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
  @keyframes bounceIn { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .modal-badge { font-size: 44px; margin-bottom: 4px; display: inline-block; }
  .modal-title { font-size: 19px; font-weight: 900; color: #ffffff; margin: 0 0 10px 0; text-shadow: 0 0 10px var(--lcd-glow); }
  .modal-score-box { background: rgba(0,0,0,0.45); border: 2px solid var(--card-border); border-radius: 18px; padding: 12px; margin-bottom: 12px; }
  .score-total-label { font-size: 13px; font-weight: bold; color: var(--text-sub); margin-bottom: 4px; }
  .score-highlight { font-size: 44px; font-weight: 900; color: var(--accent-main); text-shadow: 0 0 15px rgba(255, 42, 133, 0.6); line-height: 1.1; }
  .score-highlight span.small-unit { font-size: 18px; color: #ffffff; margin-left: 4px; }
  .score-comment { margin-top: 6px; font-size: 13px; font-weight: 900; color: var(--accent-yellow); }
  .grade-up-banner { display: none; margin-top: 8px; padding: 8px; border-radius: 12px; background: rgba(5, 255, 161, 0.16); border: 1.5px solid var(--accent-green); color: var(--accent-green); font-size: 13px; font-weight: 900; line-height: 1.4; }
  .modal-btn-area { display: flex; flex-direction: column; gap: 8px; }
  .modal-btn { width: 100%; padding: 12px 0; font-size: 15px; font-weight: 900; border: none; border-radius: 14px; cursor: pointer; }
  .modal-btn:active { transform: translateY(2px); }
  .modal-btn-retry { background: var(--accent-green); color: #0d1e18; box-shadow: 0 4px 0 var(--accent-green-shadow); }
  .modal-btn-close { background: var(--key-bg); color: #ffffff; border: 1px solid var(--card-border); }
</style>
</head>
<body class="mode-anzan">

<div class="container">
  <canvas id="confettiCanvas"></canvas>

  <div class="big-circle-overlay" id="bigCircleOverlay">
    <svg viewBox="0 0 200 200" class="big-circle-svg">
      <circle cx="100" cy="100" r="78" fill="none" stroke="#ff2a55" stroke-width="24" stroke-linecap="round" class="big-circle-path" />
    </svg>
  </div>

  <div class="top-header-wrap">
    <div class="title-bar">
      <div class="title-left">
        <div class="gadget-lights"><div class="dot-light dot-pink"></div><div class="dot-light dot-cyan"></div><div class="dot-light dot-yellow"></div></div>
        <h1 id="appMainTitle">🧠 読上あんざんマスター</h1>
      </div>
      <div class="header-right-group">
        <button type="button" id="offlineSaveBtn" class="offline-btn" onclick="cacheAllForOffline()">📥 オフライン保存</button>
        <span class="header-badge" id="modeBadge">WIDE MODE</span>
      </div>
    </div>
    <div class="subject-switcher">
      <button type="button" id="tabAnzan" class="subject-tab active-anzan" onclick="switchSubject('anzan')">🧠 読上あんざん</button>
      <button type="button" id="tabSoroban" class="subject-tab" onclick="switchSubject('soroban')">🧮 読上算</button>
    </div>
  </div>

  <div class="main-grid">
    <!-- 左側パネル -->
    <div class="left-panel">
      <div class="student-box">
        <div class="student-input-row">

  let appState = 'idle'; let currentInput = ""; let streak = 0; let currentSpeed = 1.0; let testQueue = []; let currentTestIndex = 0; let correctCount = 0; let isTesting = false; let lastTestCount = 5;
